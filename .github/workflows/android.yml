name: Android Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine assets are the one thing the app cannot build on-device: packing
  # them needs the Torch executable, and the NDK build has no host toolchain.
  # Build it here and ship the result as an APK asset. The game's own assets are
  # extracted from the user's ROM on-device.
  generate-port-o2r:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y gcc g++ git cmake ninja-build lsb-release
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.18
      with:
        key: ${{ runner.os }}-o2r-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-o2r-ccache-${{ github.ref }}
          ${{ runner.os }}-o2r-ccache-
    - name: Cache build folders
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-o2r-build-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-o2r-build-${{ github.ref }}
          ${{ runner.os }}-o2r-build-
        path: |
          tools/Torch/cmake-build-release
    - name: Generate starship.o2r
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        make -C tools/Torch type=release -j3
        tools/Torch/cmake-build-release/torch pack port starship.o2r o2r
    - uses: actions/upload-artifact@v4
      with:
        name: starship.o2r
        path: starship.o2r
        retention-days: 1

  build-android:
    needs: generate-port-o2r
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build-type: [debug, release]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;30.0.15729638"

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    # The repository root, not the assets folder: the packaging task in
    # android/app/build.gradle.kts bundles this into gamedata.zip itself.
    - name: Download starship.o2r
      uses: actions/download-artifact@v4
      with:
        name: starship.o2r
        path: .

    - name: Configure Gradle permissions
      run: chmod +x android/gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      if: matrix.build-type == 'debug'
      run: |
        cd android/
        ./gradlew assembleDebug
        mv app/build/outputs/apk/debug/app-debug.apk ../starship-debug.apk

    # Without a keystore the release build falls back to the debug key, so this
    # step is allowed to be skipped on forks that have no secrets configured.
    - name: Setup signing keystore
      if: matrix.build-type == 'release' && env.KEYSTORE_FILE != ''
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > android/app/release.keystore
        test -s android/app/release.keystore || (echo "Failed to create keystore file" && exit 1)
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}

    - name: Build Release APK
      if: matrix.build-type == 'release'
      run: |
        cd android/
        ./gradlew assembleRelease
        mv app/build/outputs/apk/release/app-release.apk ../starship-release.apk
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE != '' && 'release.keystore' || '' }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Debug APK
      if: matrix.build-type == 'debug'
      uses: actions/upload-artifact@v4
      with:
        name: starship-debug-apk
        path: starship-debug.apk
        retention-days: 7

    - name: Upload Release APK
      if: matrix.build-type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: starship-release-apk
        path: starship-release.apk
        retention-days: 30

    - name: Clean up keystore
      if: always()
      run: rm -f android/app/release.keystore
