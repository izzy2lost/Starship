name: Create Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.1)'
        required: true
        default: '1.0.1'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

jobs:
  generate-port-o2r:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install dependencies
      run: sudo apt-get install gcc g++ git cmake ninja-build lsb-release
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.18
      with:
        key: ${{ runner.os }}-o2r-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-o2r-ccache-${{ github.ref }}
          ${{ runner.os }}-o2r-ccache-
    - name: Cache build folders
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-o2r-build-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-o2r-build-${{ github.ref }}
          ${{ runner.os }}-o2r-build-
        path: |
          tools/Torch/cmake-build-release
    - name: Generate starship.o2r
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        make -C tools/Torch type=release -j3
        tools/Torch/cmake-build-release/torch pack port starship.o2r o2r
    - uses: actions/upload-artifact@v4
      with:
        name: starship.o2r
        path: starship.o2r
        retention-days: 1

  build-release:
    needs: generate-port-o2r
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Install dependencies
      run: sudo apt-get install -y ninja-build
      
    - name: Download starship.o2r
      uses: actions/download-artifact@v4
      with:
        name: starship.o2r
        path: .

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;30.0.15729638"

    - name: Configure Gradle permissions
      run: chmod +x android/gradlew
      
    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v3
      
    - name: Setup signing keystore
      if: env.KEYSTORE_FILE != ''
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > android/app/release.keystore
        test -s android/app/release.keystore || (echo "Failed to create keystore file" && exit 1)
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}

    - name: Verify APK signing
      run: |
        if [ -s android/app/release.keystore ]; then
          echo "✅ APK will be signed with release keystore"
        else
          echo "⚠️ No keystore secret configured; the release APK falls back to the debug key"
        fi

    - name: Build Release
      run: |
        cd android/
        ./gradlew assembleRelease --no-daemon \
          -PstarshipVersionName="${{ github.event.inputs.version }}" \
          -PstarshipVersionCode="${{ github.run_number }}"
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE != '' && 'release.keystore' || '' }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        
    - name: Prepare release files
      run: |
        mkdir -p release
        cp android/app/build/outputs/apk/release/app-release.apk release/starship-v${{ github.event.inputs.version }}.apk
        
    - name: Generate checksums
      run: |
        cd release
        sha256sum *.apk > checksums.txt
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Starship v${{ github.event.inputs.version }}
        body: |
          ## 🚀 Starship v${{ github.event.inputs.version }}
          
          ### 📱 Android Release

          [!IMPORTANT]
          **🎮 No desktop setup needed!** The app converts your ROM on the device
          itself — no more running Torch on a PC and copying `sf64.o2r` across.
          **📂 No storage permission needed.** The ROM is read once through the
          system file picker and nothing else on your device is touched.
          **🔥 Mods and saves managers** are built into the in-game menu.
          
          ### 📦 Downloads
          - **APK**: `starship-v${{ github.event.inputs.version }}.apk` - Direct install for Android devices
          
          ### 🔧 Installation Instructions
          1. Download the APK file
          2. Enable "Install from unknown sources" in Android settings
          3. Install the APK on your Android device
          4. Launch Starship and pick your own Star Fox 64 (US) `.z64` ROM
          5. Wait for the one-time extraction to finish — the game starts by itself
          
          ### ✅ Requirements
          - Android 7.0 (API 24) or higher
          - ARM64 or ARMv7 processor
          - Star Fox 64 ROM (US 1.0 or 1.1), supplied by you
          
          ### 🔒 Security
          SHA256 checksums are provided in `checksums.txt`
          
          ---
          Built from commit: ${{ github.sha }}
        files: |
          release/*
        draft: false
        prerelease: ${{ github.event.inputs.prerelease }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean up keystore
      if: always()
      run: rm -f android/app/release.keystore
